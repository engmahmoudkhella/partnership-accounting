{% extends "base.html" %}
{% from "macros.html" import csrf_field with context %}
{% block title %}{{ t('account_title') }}{% endblock %}
{% block content %}
<h1>{{ t('account_title') }}</h1>
<div class="grid2">
<form class="card" method="post" action="/account/prefs">{{ csrf_field() }}
<h2>{{ t('account_prefs') }}</h2>
<label>{{ t('f_lang') }}<select name="lang"><option value="ar" {{ 'selected' if user.lang=='ar' }}>العربية</option><option value="en" {{ 'selected' if user.lang=='en' }}>English</option></select></label>
<label>{{ t('f_digits') }}<select name="digits"><option value="latn" {{ 'selected' if user.digits=='latn' }}>1,234.50</option><option value="arab" {{ 'selected' if user.digits=='arab' }}>١٬٢٣٤٫٥٠</option></select></label>
<button class="primary">{{ t('btn_save') }}</button>
</form>
<form class="card" method="post" action="/account/password">{{ csrf_field() }}
<h2>{{ t('account_password') }}</h2>
<label>{{ t('f_current_password') }}<input type="password" name="current" required autocomplete="current-password"></label>
<label>{{ t('f_new_password') }}<input type="password" name="new" required minlength="8" autocomplete="new-password"></label>
<label>{{ t('f_password2') }}<input type="password" name="new2" required minlength="8" autocomplete="new-password"></label>
<button class="primary">{{ t('btn_save') }}</button>
</form>
</div>
{% endblock %}
